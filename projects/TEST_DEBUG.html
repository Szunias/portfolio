<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEBUG TEST</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            padding: 10px;
            margin: 5px 0;
            background: #111;
            border-left: 4px solid #0f0;
        }
        .error {
            border-left-color: #f00;
            color: #f00;
        }
        .warning {
            border-left-color: #ff0;
            color: #ff0;
        }
        .success {
            border-left-color: #0f0;
            color: #0f0;
        }
        .lang-btn {
            padding: 10px 20px;
            margin: 5px;
            background: #333;
            color: #fff;
            border: 2px solid #666;
            cursor: pointer;
            font-size: 16px;
        }
        .lang-btn.active {
            background: #0f0;
            color: #000;
            border-color: #0f0;
        }
        #test-text {
            font-size: 24px;
            padding: 20px;
            background: #111;
            margin: 20px 0;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <h1>🔍 TRANSLATION DEBUG TEST</h1>

    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="pl">PL</button>
        <button class="lang-btn" data-lang="nl">NL</button>
    </div>

    <div id="test-text" data-i18n="back">Initial Text</div>

    <div id="log"></div>

    <script>
        const log = document.getElementById('log');

        function addLog(msg, type = 'status') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(div);
            console.log(msg);
        }

        addLog('=== STARTING DEBUG TEST ===', 'success');
        addLog(`Current URL: ${window.location.href}`);
        addLog(`Current pathname: ${window.location.pathname}`);

        // Test 1: Check if we can access localStorage
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            addLog('✓ localStorage works', 'success');
        } catch(e) {
            addLog('✗ localStorage ERROR: ' + e.message, 'error');
        }

        // Test 2: Check if project-translations.js exists
        addLog('Checking if project-translations.js exists...');
        fetch('../assets/js/project-translations.js')
            .then(res => {
                if (res.ok) {
                    addLog('✓ project-translations.js found (HTTP ' + res.status + ')', 'success');
                    return res.text();
                } else {
                    addLog('✗ project-translations.js NOT found (HTTP ' + res.status + ')', 'error');
                }
            })
            .then(content => {
                if (content) {
                    addLog(`✓ File size: ${content.length} bytes`, 'success');
                    if (content.includes('function loadTranslations')) {
                        addLog('✓ Contains loadTranslations function', 'success');
                    } else {
                        addLog('✗ Missing loadTranslations function', 'error');
                    }
                }
            })
            .catch(err => {
                addLog('✗ Fetch error: ' + err.message, 'error');
            });

        // Test 3: Try to load translation JSON
        addLog('Attempting to load ../locales/akantilado.json...');
        fetch('../locales/akantilado.json')
            .then(res => {
                if (res.ok) {
                    addLog('✓ JSON file found (HTTP ' + res.status + ')', 'success');
                    return res.json();
                } else {
                    addLog('✗ JSON file NOT found (HTTP ' + res.status + ')', 'error');
                }
            })
            .then(data => {
                if (data) {
                    addLog('✓ JSON parsed successfully', 'success');
                    const langs = Object.keys(data);
                    addLog(`✓ Languages found: ${langs.join(', ')}`, 'success');

                    // Test the translations
                    if (data.en && data.en.back) {
                        addLog(`✓ EN translation for 'back': "${data.en.back}"`, 'success');
                    }
                    if (data.pl && data.pl.back) {
                        addLog(`✓ PL translation for 'back': "${data.pl.back}"`, 'success');
                    }
                    if (data.nl && data.nl.back) {
                        addLog(`✓ NL translation for 'back': "${data.nl.back}"`, 'success');
                    }

                    // Now test applying translations manually
                    window.testTranslations = data;
                    addLog('=== Manual translation test ===', 'warning');

                    document.querySelectorAll('.lang-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const lang = btn.dataset.lang;
                            addLog(`Switching to: ${lang}`, 'warning');

                            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');

                            const textEl = document.getElementById('test-text');
                            const translation = data[lang]?.back;

                            if (translation) {
                                textEl.textContent = translation;
                                addLog(`✓ Applied translation: "${translation}"`, 'success');
                            } else {
                                addLog(`✗ No translation found for ${lang}.back`, 'error');
                            }
                        });
                    });

                    addLog('✓ Manual translation buttons ready - TRY CLICKING THEM!', 'success');
                }
            })
            .catch(err => {
                addLog('✗ JSON error: ' + err.message, 'error');
            });

        // Test 4: Check if the script tag was loaded
        setTimeout(() => {
            addLog('=== Checking if project-translations.js was loaded ===', 'warning');

            const scripts = Array.from(document.scripts);
            const translationScript = scripts.find(s => s.src.includes('project-translations.js'));

            if (translationScript) {
                addLog('✓ Script tag found in page', 'success');
                addLog(`  src: ${translationScript.src}`);
            } else {
                addLog('✗ Script tag NOT found in page', 'error');
            }

            // Check for global functions
            if (window.projectTranslations) {
                addLog('✓ window.projectTranslations exists', 'success');
            } else {
                addLog('✗ window.projectTranslations NOT found', 'error');
            }

            addLog('=== TEST COMPLETE ===', 'success');
            addLog('If manual translation buttons work above, the system CAN work!', 'warning');
        }, 2000);
    </script>

    <!-- Try to load the actual script -->
    <script src="../assets/js/project-translations.js"></script>
</body>
</html>
