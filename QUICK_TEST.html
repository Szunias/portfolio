<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Translation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
        }
        .lang-btn {
            padding: 10px 20px;
            background: #333;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
        }
        .lang-btn.active {
            background: #0066cc;
        }
        .test-area {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        .success {
            background: #00aa00;
        }
        .error {
            background: #cc0000;
        }
        .warning {
            background: #ff8800;
        }
    </style>
</head>
<body>
    <h1>🔧 Quick Translation Test</h1>

    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="pl">PL</button>
        <button class="lang-btn" data-lang="nl">NL</button>
    </div>

    <div class="test-area">
        <h2>Test Content (should change when you click language buttons):</h2>
        <p data-i18n="test.title">This is a test title</p>
        <p data-i18n="test.description">This is a test description</p>
    </div>

    <div id="status"></div>

    <div class="test-area">
        <h2>Debug Information:</h2>
        <div id="debug-info" style="font-family: monospace; white-space: pre-wrap;"></div>
    </div>

    <!-- Manual inline test (without external script) -->
    <script>
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug-info');

        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);

            debugDiv.textContent += `\n${new Date().toLocaleTimeString()} - ${message}`;
        }

        log('Starting translation test...', 'warning');

        // Manually define test translations
        const testTranslations = {
            en: {
                test: {
                    title: 'English Title',
                    description: 'This is English description'
                }
            },
            pl: {
                test: {
                    title: 'Polski Tytuł',
                    description: 'To jest polski opis'
                }
            },
            nl: {
                test: {
                    title: 'Nederlandse Titel',
                    description: 'Dit is Nederlandse beschrijving'
                }
            }
        };

        let currentLang = 'en';

        function getNestedValue(obj, path) {
            return path.split('.').reduce((current, key) => current?.[key], obj);
        }

        function applyTranslations(lang) {
            log(`Applying translations for: ${lang}`, 'success');

            const langData = testTranslations[lang];
            if (!langData) {
                log(`No translations for language: ${lang}`, 'error');
                return;
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const translation = getNestedValue(langData, key);

                if (translation) {
                    el.textContent = translation;
                    log(`✓ Updated ${key} = "${translation}"`, 'success');
                } else {
                    log(`✗ Missing translation for key: ${key}`, 'error');
                }
            });

            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        // Test localStorage
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            log('✓ localStorage is working', 'success');
        } catch (e) {
            log('✗ localStorage is NOT working: ' + e.message, 'error');
        }

        // Bind buttons
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.dataset.lang;
                log(`Button clicked: ${lang}`, 'warning');
                currentLang = lang;
                applyTranslations(lang);
                try {
                    localStorage.setItem('language', lang);
                } catch (e) {
                    log('Could not save to localStorage', 'error');
                }
            });
        });

        // Apply initial language
        applyTranslations(currentLang);

        // Now test if project-translations.js exists
        log('Checking if project-translations.js exists...', 'warning');
        fetch('assets/js/project-translations.js')
            .then(response => {
                if (response.ok) {
                    log('✓ project-translations.js EXISTS', 'success');
                    return response.text();
                } else {
                    log(`✗ project-translations.js NOT FOUND (HTTP ${response.status})`, 'error');
                }
            })
            .then(content => {
                if (content) {
                    log(`✓ File size: ${content.length} bytes`, 'success');
                    if (content.includes('DEBUG')) {
                        log('✓ File contains DEBUG flag', 'success');
                    }
                }
            })
            .catch(err => {
                log('✗ Error fetching file: ' + err.message, 'error');
            });

        // Test if pawism.json exists
        log('Checking if locales/pawism.json exists...', 'warning');
        fetch('locales/pawism.json')
            .then(response => {
                if (response.ok) {
                    log('✓ locales/pawism.json EXISTS', 'success');
                    return response.json();
                } else {
                    log(`✗ locales/pawism.json NOT FOUND (HTTP ${response.status})`, 'error');
                }
            })
            .then(data => {
                if (data) {
                    const langs = Object.keys(data);
                    log(`✓ Languages in file: ${langs.join(', ')}`, 'success');
                }
            })
            .catch(err => {
                log('✗ Error fetching JSON: ' + err.message, 'error');
            });

        log('=== Test complete. Check results above. ===', 'warning');
        log('If you see text changes when clicking EN/PL/NL, translations work!', 'success');
    </script>
</body>
</html>
