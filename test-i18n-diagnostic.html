<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i18n Diagnostic Tool - Projects Page</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #00ffff; }
        h2 { color: #ffff00; margin-top: 30px; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #00ff00;
            background: #2a2a2a;
        }
        .error { border-left-color: #ff0000; color: #ff6b6b; }
        .success { border-left-color: #00ff00; color: #00ff00; }
        .warning { border-left-color: #ffaa00; color: #ffaa00; }
        .info { border-left-color: #00aaff; color: #00aaff; }
        pre {
            background: #0a0a0a;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid #444;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00cc00; }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #444;
            background: #111;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 i18n Diagnostic Tool - Projects Page</h1>
        <p>Open DevTools Console (F12) for detailed logs</p>

        <div class="test-section">
            <h2>Quick Actions</h2>
            <button onclick="runAllTests()">▶ Run All Tests</button>
            <button onclick="testLanguageSwitch('pl')">Switch to PL</button>
            <button onclick="testLanguageSwitch('nl')">Switch to NL</button>
            <button onclick="testLanguageSwitch('en')">Switch to EN</button>
            <button onclick="location.reload()">Reload Page</button>
        </div>

        <div id="results"></div>
    </div>

    <script type="module">
        import i18n from '/assets/js/refactored/services/BulletproofI18n.js';

        // Expose for debugging
        window.i18n = i18n;
        window.testLanguageSwitch = async (lang) => {
            log(`🌐 Switching to language: ${lang}`, 'info');
            await i18n.setLanguage(lang);
            runAllTests();
        };

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            console.log(`[${type.toUpperCase()}] ${message}`);
            document.getElementById('results').appendChild(div);
        }

        function logObject(title, obj) {
            const div = document.createElement('div');
            div.className = 'status info';
            div.innerHTML = `<strong>${title}</strong><pre>${JSON.stringify(obj, null, 2)}</pre>`;
            console.log(title, obj);
            document.getElementById('results').appendChild(div);
        }

        window.runAllTests = async function() {
            document.getElementById('results').innerHTML = '';
            log('═══════════════════════════════════════', 'info');
            log('Starting i18n Diagnostic Tests', 'info');
            log('═══════════════════════════════════════', 'info');

            // Test 1: Check if i18n exists
            log('\n📋 TEST 1: Check if window.i18n exists', 'info');
            if (typeof window.i18n !== 'undefined') {
                log('✓ window.i18n exists', 'success');
            } else {
                log('✗ window.i18n does NOT exist', 'error');
                return;
            }

            // Test 2: Current language
            log('\n📋 TEST 2: Current language', 'info');
            const currentLang = i18n.getLanguage();
            log(`Current language: ${currentLang}`, 'success');
            logObject('i18n.lang', currentLang);

            // Test 3: Supported languages
            log('\n📋 TEST 3: Supported languages', 'info');
            logObject('i18n.supportedLanguages', i18n.supportedLanguages);

            // Test 4: Loaded translations
            log('\n📋 TEST 4: Loaded translations', 'info');
            const loadedLangs = Object.keys(i18n.translations);
            log(`Loaded language packs: ${loadedLangs.join(', ')}`, loadedLangs.length > 0 ? 'success' : 'warning');

            for (const lang of loadedLangs) {
                const keys = Object.keys(i18n.translations[lang] || {});
                log(`  - ${lang}: ${keys.length} top-level keys`, 'info');
                logObject(`${lang} translations (first 5 keys)`, keys.slice(0, 5));
            }

            // Test 5: Current language translations
            log('\n📋 TEST 5: Current language translations', 'info');
            const currentTranslations = i18n.translations[currentLang];
            if (currentTranslations) {
                const allKeys = Object.keys(currentTranslations);
                log(`✓ Translations loaded for ${currentLang}: ${allKeys.length} keys`, 'success');
                logObject(`${currentLang} translation keys`, allKeys);

                // Check for projects object
                if (currentTranslations.projects) {
                    const projectKeys = Object.keys(currentTranslations.projects);
                    log(`✓ projects object exists with ${projectKeys.length} projects`, 'success');
                    logObject('Project keys', projectKeys);

                    // Check first project's tech array
                    const firstProject = projectKeys[0];
                    if (firstProject && currentTranslations.projects[firstProject].tech) {
                        log(`✓ First project (${firstProject}) has tech array`, 'success');
                        logObject(`${firstProject}.tech`, currentTranslations.projects[firstProject].tech);
                    } else {
                        log(`✗ First project (${firstProject}) missing tech array`, 'error');
                    }
                } else {
                    log('✗ projects object NOT found in translations', 'error');
                }
            } else {
                log(`✗ No translations loaded for ${currentLang}`, 'error');
            }

            // Test 6: Translation function
            log('\n📋 TEST 6: Translation function (i18n.t)', 'info');
            const testKeys = [
                'projects_page_title',
                'projects_filter_all',
                'projects.shadow_frames.title',
                'projects.shadow_frames.tech'
            ];

            for (const key of testKeys) {
                const result = i18n.t(key);
                if (result === key) {
                    log(`✗ Translation FAILED for "${key}" - returned key itself`, 'error');
                } else {
                    log(`✓ Translation OK for "${key}" = "${Array.isArray(result) ? '[array]' : result}"`, 'success');
                    if (Array.isArray(result)) {
                        logObject(`${key} value`, result);
                    }
                }
            }

            // Test 7: DOM elements with data-i18n
            log('\n📋 TEST 7: DOM elements with data-i18n', 'info');
            const dataI18nElements = document.querySelectorAll('[data-i18n]');
            log(`Found ${dataI18nElements.length} elements with [data-i18n]`, dataI18nElements.length > 0 ? 'success' : 'warning');

            const sample = Array.from(dataI18nElements).slice(0, 5);
            for (const el of sample) {
                const key = el.getAttribute('data-i18n');
                const content = el.textContent.trim();
                const isTranslated = content !== key && content.length > 0;
                log(`  ${isTranslated ? '✓' : '✗'} [data-i18n="${key}"] = "${content}"`, isTranslated ? 'success' : 'error');
            }

            // Test 8: DOM elements with data-tech
            log('\n📋 TEST 8: DOM elements with data-tech', 'info');
            const dataTechElements = document.querySelectorAll('[data-tech]');
            log(`Found ${dataTechElements.length} elements with [data-tech]`, dataTechElements.length > 0 ? 'success' : 'warning');

            const techSample = Array.from(dataTechElements).slice(0, 5);
            for (const el of techSample) {
                const key = el.getAttribute('data-tech');
                const hasContent = el.innerHTML.trim().length > 0;
                const content = el.innerHTML.substring(0, 100);
                log(`  ${hasContent ? '✓' : '✗'} [data-tech="${key}"] ${hasContent ? 'HAS CONTENT' : 'EMPTY'}`, hasContent ? 'success' : 'error');
                if (hasContent) {
                    log(`    Content: ${content}...`, 'info');
                }
            }

            // Test 9: LocalStorage
            log('\n📋 TEST 9: LocalStorage language setting', 'info');
            const storedLang = localStorage.getItem('language');
            log(`localStorage.language = ${storedLang}`, storedLang ? 'success' : 'warning');

            // Test 10: HTML lang attribute
            log('\n📋 TEST 10: HTML lang attribute', 'info');
            const htmlLang = document.documentElement.getAttribute('lang');
            log(`<html lang="${htmlLang}">`, 'info');
            if (htmlLang === currentLang) {
                log('✓ HTML lang matches current language', 'success');
            } else {
                log(`✗ HTML lang (${htmlLang}) does NOT match current language (${currentLang})`, 'warning');
            }

            // Test 11: Event listeners
            log('\n📋 TEST 11: Language change event', 'info');
            log('Adding test listener for languageChanged event...', 'info');
            window.addEventListener('languageChanged', (e) => {
                log(`✓ languageChanged event fired! New lang: ${e.detail.language}, Previous: ${e.detail.previousLanguage}`, 'success');
            }, { once: true });

            log('\n═══════════════════════════════════════', 'info');
            log('✓ All tests completed', 'success');
            log('═══════════════════════════════════════', 'info');
        };

        // Initialize i18n and run tests
        (async () => {
            try {
                log('Initializing i18n...', 'info');
                await i18n.init();
                log('✓ i18n initialized successfully', 'success');

                // Auto-run tests after initialization
                setTimeout(runAllTests, 500);
            } catch (error) {
                log(`✗ i18n initialization FAILED: ${error.message}`, 'error');
                console.error(error);
            }
        })();
    </script>
</body>
</html>
