<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }

<script type="module">
// =========================================
// MUSIC GALAXY - full-screen navigable star map
// Stations (genres) are constellations; every star is a track.
// Owns: rendering, camera navigation, picking.
// Reads: .track-card classes + [data-filtered-out] (set by music.js).
// Listens: 'music:station' CustomEvent to fly the camera.
// Calls: card.click() to play, window.musicApp.preview(card) on hover.
// =========================================
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

try {

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 220);

// Flag for CSS: hide the fallback list, run full-screen
document.documentElement.classList.add('has-3d');

const galaxy = new THREE.Group();
scene.add(galaxy);

// ---------- Canvas-generated textures ----------
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function radialGlowTexture() {
  const c = makeCanvas(128);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.12)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function ringTexture() {
  const c = makeCanvas(128);
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,255,255,1)';
  g.lineWidth = 5;
  g.beginPath();
  g.arc(64, 64, 52, 0, Math.PI * 2);
  g.stroke();
  return new THREE.CanvasTexture(c);
}

function labelTexture(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 96;
  const g = c.getContext('2d');
  g.font = '500 44px "IBM Plex Mono", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,0.9)';
  g.shadowBlur = 18;
  g.shadowOffsetY = 3;
  g.fillStyle = 'rgba(244,247,249,0.98)';
  g.fillText(text.toUpperCase(), 256, 50);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

const glowTex = radialGlowTexture();
const ringTex = ringTexture();

// ---------- Stations / constellations ----------
const STATION_COLORS = {
  electronic: 0x5aa7e0,
  film: 0xd8b46a,
  jazz: 0xe0964a,
  metal: 0xb88f86,
  remix: 0xa87ae0,
  single: 0x7ad8c8,
  techno: 0x7a86e8,
  evolution: 0x74c47a
};
const CLUSTER_IDS = ['electronic', 'film', 'jazz', 'metal', 'remix', 'single', 'techno'];
const CLUSTER_RING = 5.6;

const clusters = {};
CLUSTER_IDS.forEach((id, i) => {
  const angle = (i / CLUSTER_IDS.length) * Math.PI * 2 - Math.PI / 3;
  clusters[id] = {
    id,
    color: new THREE.Color(STATION_COLORS[id]),
    center: new THREE.Vector3(
      Math.cos(angle) * CLUSTER_RING,
      Math.sin(i * 2.7) * 0.9,
      Math.sin(angle) * CLUSTER_RING
    ),
    angle,
    members: []
  };
});

// Deterministic pseudo-random (stable star positions between visits)
function rand(seed) {
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// Evolution arm: chronological spiral trailing out of the galaxy
function evolutionPosition(i, total) {
  const t = i / Math.max(1, total - 1);
  const angle = -Math.PI / 3 + Math.PI * 0.55 + t * Math.PI * 2.1;
  const radius = 7.4 + t * 4.6;
  return new THREE.Vector3(
    Math.cos(angle) * radius,
    Math.sin(t * Math.PI * 3.2) * 0.55 - 0.3,
    Math.sin(angle) * radius
  );
}

// ---------- Background star dust ----------
function starCloud(count, rMin, rMax, ySpread, size, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = rMin + Math.random() * (rMax - rMin);
    const th = Math.random() * Math.PI * 2;
    pos[i * 3] = Math.cos(th) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * ySpread;
    pos[i * 3 + 2] = Math.sin(th) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xc8d8ea, size, transparent: true, opacity,
    sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
}
const farStars = starCloud(1700, 4, 34, 22, 0.04, 0.18);
const nearStars = starCloud(320, 2, 14, 6, 0.055, 0.26);
galaxy.add(farStars);
galaxy.add(nearStars);

// Galactic core: a quiet navigation sun that anchors the station constellations.
const coreGlow = new THREE.MeshPhysicalMaterial({
  color: 0xd9c98d, metalness: 0.05, roughness: 0.42,
  emissive: 0x8d7a45, emissiveIntensity: 0.22, transparent: true, opacity: 0.9
});
const core = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), coreGlow);
galaxy.add(core);
const coreHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xd9c98d, transparent: true, opacity: 0.16,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
coreHalo.scale.setScalar(1.75);
galaxy.add(coreHalo);
const coreOrbit = new THREE.Mesh(
  new THREE.RingGeometry(0.48, 0.5, 96),
  new THREE.MeshBasicMaterial({
    color: 0xaac6de, transparent: true, opacity: 0.18,
    side: THREE.DoubleSide, depthWrite: false
  })
);
coreOrbit.rotation.x = Math.PI / 2;
galaxy.add(coreOrbit);

// Nebulae + labels per constellation
const labelSprites = [];
CLUSTER_IDS.forEach(id => {
  const cl = clusters[id];
  const nebula = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: cl.color, transparent: true, opacity: 0.1,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  nebula.position.copy(cl.center);
  nebula.scale.setScalar(4.6);
  galaxy.add(nebula);
  cl.nebula = nebula;

  const label = new THREE.Sprite(new THREE.SpriteMaterial({
    map: labelTexture(id === 'single' ? 'singles' : id),
    transparent: true, opacity: 0.72, depthWrite: false
  }));
  label.position.copy(cl.center).add(new THREE.Vector3(0, 1.7, 0));
  label.scale.set(2.6, 0.49, 1);
  galaxy.add(label);
  cl.label = label;
  labelSprites.push({ id, label });
});

// Evolution arm label
{
  const label = new THREE.Sprite(new THREE.SpriteMaterial({
    map: labelTexture('evolution'),
    transparent: true, opacity: 0.72, depthWrite: false
  }));
  const mid = evolutionPosition(27, 54);
  label.position.copy(mid).add(new THREE.Vector3(0, 1.6, 0));
  label.scale.set(2.6, 0.49, 1);
  galaxy.add(label);
  labelSprites.push({ id: 'evolution', label });
}

// ---------- Track stars ----------
const texLoader = new THREE.TextureLoader();
const stars = [];
const rayTargets = [];
const camWorld = new THREE.Vector3();

function primaryTag(card) {
  const tags = (card.getAttribute('data-tags') || '').split(',').map(t => t.trim());
  return tags.find(t => t !== 'single' && CLUSTER_IDS.includes(t)) ||
         (tags.includes('single') ? 'single' : tags[0]);
}

function addStar(card, position, color, isEvo) {
  const group = new THREE.Group();
  group.position.copy(position);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(isEvo ? 0.05 : 0.08, 12, 12),
    new THREE.MeshBasicMaterial({
      color: 0xf2f5f8, transparent: true, opacity: 0.95, depthWrite: false
    })
  );
  group.add(glint);

  const haloMat = new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: isEvo ? 0.4 : 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const halo = new THREE.Sprite(haloMat);
  halo.scale.setScalar(isEvo ? 0.5 : 0.8);
  group.add(halo);

  const ringMat = new THREE.SpriteMaterial({
    map: ringTex, color: 0xffffff, transparent: true, opacity: 0,
    depthWrite: false
  });
  const ring = new THREE.Sprite(ringMat);
  ring.scale.setScalar(isEvo ? 0.42 : 0.62);
  group.add(ring);

  // Cover art plane, revealed on hover / while active (main tracks only)
  let faceMat = null, face = null;
  const thumb = card.querySelector('.track-card__image');
  if (!isEvo && thumb && thumb.getAttribute('src')) {
    faceMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
    face = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), faceMat);
    face.position.y = 0.52;
    group.add(face);
    texLoader.load(thumb.getAttribute('src'), tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      faceMat.map = tex;
      faceMat.needsUpdate = true;
    });
  }

  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(isEvo ? 0.24 : 0.34, 8, 8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hit.userData.starIndex = stars.length;
  group.add(hit);

  galaxy.add(group);
  stars.push({
    group, glint, halo, haloMat, ring, ringMat, face, faceMat, card, isEvo,
    color, baseHalo: isEvo ? 0.26 : 0.38, hover: 0, pulse: rand(stars.length) * Math.PI * 2
  });
  rayTargets.push(hit);
}

// Main tracks -> constellation of their primary genre
{
  const cards = Array.from(document.querySelectorAll('#tracks-grid .track-card'));
  const counters = {};
  cards.forEach(card => {
    const tag = primaryTag(card) || 'electronic';
    const cl = clusters[tag] || clusters.electronic;
    const k = counters[tag] = (counters[tag] || 0) + 1;
    cl.members.push(card);
    const seed = cl.members.length * 17 + CLUSTER_IDS.indexOf(tag) * 131;
    const a = rand(seed) * Math.PI * 2;
    const r = 0.45 + rand(seed + 1) * 1.15;
    const pos = cl.center.clone().add(new THREE.Vector3(
      Math.cos(a) * r,
      (rand(seed + 2) - 0.5) * 1.1,
      Math.sin(a) * r
    ));
    addStar(card, pos, cl.color, false);
    cl.members[cl.members.length - 1] = { card, pos };
  });
}

// Evolution demos -> chronological arm
const evoPositions = [];
{
  const cards = Array.from(document.querySelectorAll('#evolution-grid .track-card'));
  const evoColor = new THREE.Color(STATION_COLORS.evolution);
  cards.forEach((card, i) => {
    const pos = evolutionPosition(i, cards.length);
    // small jitter so the arm reads as dust, not beads
    pos.x += (rand(i * 3 + 500) - 0.5) * 0.5;
    pos.y += (rand(i * 3 + 501) - 0.5) * 0.4;
    pos.z += (rand(i * 3 + 502) - 0.5) * 0.5;
    evoPositions.push(pos);
    addStar(card, pos, evoColor, true);
  });
}

// ---------- Constellation lines ----------
function addLine(points, color, opacity) {
  const mat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), mat);
  galaxy.add(line);
  return mat;
}

const clusterLineMats = {};
CLUSTER_IDS.forEach(id => {
  const cl = clusters[id];
  if (cl.members.length < 2) return;
  const sorted = cl.members.slice().sort((m, n) => {
    const am = Math.atan2(m.pos.z - cl.center.z, m.pos.x - cl.center.x);
    const an = Math.atan2(n.pos.z - cl.center.z, n.pos.x - cl.center.x);
    return am - an;
  });
  clusterLineMats[id] = addLine(sorted.map(m => m.pos), cl.color, 0.16);
});
let evoLineMat = null;
if (evoPositions.length > 1) {
  evoLineMat = addLine(evoPositions, STATION_COLORS.evolution, 0.12);
}

const rimLight = new THREE.DirectionalLight(0xd8e6f2, 2.2);
rimLight.position.set(-4, 3, -3);
scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x30343a, 0.8));

// ---------- Camera controller (orbit + zoom + fly-to) ----------
const ctrl = {
  target: new THREE.Vector3(0, 0, 0),
  theta: -Math.PI / 3 + 0.4,
  phi: 1.02,
  radius: 19,
  dTarget: new THREE.Vector3(0, 0, 0),
  dTheta: -Math.PI / 3 + 0.4,
  dPhi: 1.02,
  dRadius: 19
};
const RADIUS_MIN = 3.2, RADIUS_MAX = 30;

function stationView(id) {
  if (id === 'all') {
    return { target: new THREE.Vector3(0, 0, 0), radius: innerWidth <= 820 ? 24 : 19, theta: null };
  }
  if (id === 'evolution') {
    const mid = evolutionPosition(27, 54);
    return {
      target: mid.clone().multiplyScalar(0.72),
      radius: innerWidth <= 820 ? 15 : 11.5,
      theta: Math.atan2(mid.x, mid.z)
    };
  }
  const cl = clusters[id];
  if (!cl) return null;
  return {
    target: cl.center.clone(),
    radius: innerWidth <= 820 ? 8.5 : 6.4,
    theta: Math.atan2(cl.center.x, cl.center.z)
  };
}

let activeStation = 'all';
document.addEventListener('music:station', e => {
  activeStation = (e.detail && e.detail.station) || 'all';
  const view = stationView(activeStation);
  if (!view) return;
  ctrl.dTarget.copy(view.target);
  ctrl.dRadius = view.radius;
  if (view.theta !== null && view.theta !== undefined) {
    // take the short way around
    let t = view.theta;
    while (t - ctrl.dTheta > Math.PI) t -= Math.PI * 2;
    while (t - ctrl.dTheta < -Math.PI) t += Math.PI * 2;
    ctrl.dTheta = t;
  }
  if (reduceMotion) {
    ctrl.target.copy(ctrl.dTarget);
    ctrl.radius = ctrl.dRadius;
    ctrl.theta = ctrl.dTheta;
  }
});

function applyCamera() {
  const sinPhi = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * sinPhi * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi),
    ctrl.target.z + ctrl.radius * sinPhi * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);
}

// ---------- Input: drag orbit, wheel zoom, pinch, pick ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hoverIdx = -1;

const tip = document.createElement('div');
tip.className = 'star-tip';
tip.setAttribute('aria-hidden', 'true');
document.body.appendChild(tip);

function cardPickable(card) {
  return !card.hasAttribute('data-filtered-out');
}

function pickStar(clientX, clientY) {
  if (!rayTargets.length) return -1;
  ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(rayTargets, false);
  for (const hit of hits) {
    const idx = hit.object.userData.starIndex;
    if (idx >= 0 && cardPickable(stars[idx].card)) return idx;
  }
  return -1;
}

function showTip(idx, x, y) {
  if (idx < 0) {
    tip.classList.remove('on');
    return;
  }
  const star = stars[idx];
  const title = star.card.querySelector('.track-card__title');
  const year = star.card.querySelector('.track-card__year');
  tip.textContent = (title ? title.textContent : 'Play track') +
    (year ? ' · ' + year.textContent : '');
  tip.style.transform = 'translate(' + Math.min(x + 16, innerWidth - 220) + 'px,' + (y - 10) + 'px)';
  tip.classList.add('on');
}

const pointers = new Map();
let dragging = false, pinchDist = 0, downX = 0, downY = 0, moved = 0;
let lastInteraction = 0;

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInteraction = performance.now();
  if (pointers.size === 1) {
    dragging = true;
    moved = 0;
    downX = e.clientX; downY = e.clientY;
    document.body.classList.add('is-dragging');
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (prev && dragging && pointers.size === 1) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    moved += Math.abs(dx) + Math.abs(dy);
    ctrl.dTheta -= dx * 0.0052;
    ctrl.dPhi = Math.max(0.25, Math.min(1.45, ctrl.dPhi - dy * 0.0045));
    ctrl.theta = ctrl.dTheta;
    ctrl.phi = ctrl.dPhi;
    lastInteraction = performance.now();
  }
  if (prev) { prev.x = e.clientX; prev.y = e.clientY; }

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchDist > 0) {
      ctrl.dRadius = Math.max(RADIUS_MIN, Math.min(RADIUS_MAX, ctrl.dRadius * (pinchDist / d)));
    }
    pinchDist = d;
    lastInteraction = performance.now();
    return;
  }

  // hover pick (mouse only, and not while dragging)
  if (!dragging && e.pointerType === 'mouse') {
    const idx = pickStar(e.clientX, e.clientY);
    if (idx !== hoverIdx) {
      hoverIdx = idx;
      showTip(idx, e.clientX, e.clientY);
      if (idx >= 0 && window.musicApp) window.musicApp.preview(stars[idx].card);
    } else if (idx >= 0) {
      showTip(idx, e.clientX, e.clientY);
    }
    canvas.style.cursor = idx >= 0 ? 'pointer' : 'grab';
  }
});

function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0 && dragging) {
    dragging = false;
    document.body.classList.remove('is-dragging');
    // treat as a click when the pointer barely moved
    if (moved < 8) {
      const idx = pickStar(e.clientX, e.clientY);
      if (idx >= 0) {
        stars[idx].card.click();
      }
    }
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', () => {
  if (!dragging && hoverIdx >= 0) { hoverIdx = -1; showTip(-1); }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(e.deltaY * 0.0011);
  ctrl.dRadius = Math.max(RADIUS_MIN, Math.min(RADIUS_MAX, ctrl.dRadius * factor));
  lastInteraction = performance.now();
}, { passive: false });

// Touch: let the galaxy own gestures on the canvas
canvas.style.touchAction = 'none';

// ---------- Layout / resize ----------
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, w > 1600 ? 1.5 : 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
let resizeTimer = 0, lastResize = 0;
addEventListener('resize', () => {
  const now = performance.now();
  clearTimeout(resizeTimer);
  if (now - lastResize > 150) {
    lastResize = now;
    layout();
  } else {
    resizeTimer = setTimeout(() => { lastResize = performance.now(); layout(); }, 160);
  }
});
layout();

canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => layout());

// ---------- Render loop ----------
const clock = new THREE.Clock();
const damp = reduceMotion ? 1 : 0.06;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // idle drift: gentle orbit when the user isn't touching anything
  const idle = performance.now() - lastInteraction > 4000;
  if (!reduceMotion && idle && !dragging) {
    ctrl.dTheta += dt * 0.02;
  }

  ctrl.theta += (ctrl.dTheta - ctrl.theta) * damp;
  ctrl.phi += (ctrl.dPhi - ctrl.phi) * damp;
  ctrl.radius += (ctrl.dRadius - ctrl.radius) * damp;
  ctrl.target.lerp(ctrl.dTarget, damp);
  applyCamera();

  if (!reduceMotion) {
    farStars.rotation.y = t * 0.004;
    nearStars.rotation.y = -t * 0.007;
    core.rotation.y = t * 0.05;
    coreOrbit.rotation.z = t * 0.08;
    coreGlow.emissiveIntensity = 0.2 + Math.sin(t * 1.2) * 0.04;
    coreHalo.material.opacity = 0.13 + Math.sin(t * 1.1) * 0.025;
  }

  const stationActive = activeStation !== 'all';
  labelSprites.forEach(entry => {
    const on = activeStation === entry.id;
    const target = on ? 1 : stationActive ? 0.34 : 0.72;
    entry.label.material.opacity += (target - entry.label.material.opacity) * 0.08;
  });
  CLUSTER_IDS.forEach(id => {
    const mat = clusterLineMats[id];
    if (!mat) return;
    const target = activeStation === id ? 0.28 : stationActive ? 0.035 : 0.1;
    mat.opacity += (target - mat.opacity) * 0.08;
    clusters[id].nebula.material.opacity +=
      ((activeStation === id ? 0.12 : stationActive ? 0.025 : 0.055) - clusters[id].nebula.material.opacity) * 0.08;
  });
  if (evoLineMat) {
    const target = activeStation === 'evolution' ? 0.24 : stationActive ? 0.035 : 0.08;
    evoLineMat.opacity += (target - evoLineMat.opacity) * 0.08;
  }

  camera.getWorldPosition(camWorld);
  stars.forEach((star, idx) => {
    const filtered = star.card.hasAttribute('data-filtered-out');
    const isActive = star.card.classList.contains('active');
    const isPlaying = isActive && star.card.classList.contains('is-playing');
    const targetHover = idx === hoverIdx ? 1 : 0;
    star.hover += (targetHover - star.hover) * 0.14;

    const dim = filtered ? 0.22 : 1;
    const pulse = isPlaying && !reduceMotion ? 1 + Math.sin(t * 4 + star.pulse) * 0.1 : 1;
    const scale = (isPlaying ? 1.28 : isActive ? 1.16 : 1) * (1 + star.hover * 0.28) * pulse;
    star.group.scale.setScalar(scale);

    star.haloMat.opacity = star.baseHalo * dim * (1 + star.hover * 0.28) * (isPlaying ? 1.12 : 1);
    star.glint.material.opacity = (star.isEvo ? 0.8 : 0.95) * Math.max(0.35, dim);
    star.ringMat.opacity = isActive ? (isPlaying ? 0.72 : 0.42) : star.hover * 0.24;

    if (star.faceMat) {
      const show = (star.hover > 0.02 || isActive) && !filtered && star.faceMat.map;
      star.faceMat.opacity += ((show ? 0.55 + star.hover * 0.45 : 0) - star.faceMat.opacity) * 0.12;
      if (star.face) star.face.lookAt(camWorld);
    }
  });

  renderer.render(scene, camera);
});

} catch (err) {
  // WebGL unavailable: reveal the plain track list instead
  document.documentElement.classList.add('no-3d');
  console.warn('3D galaxy disabled:', err);
}
</script>
