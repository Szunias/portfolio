<!-- The showreel's branded play button used to be display:none until the
     deferred script added a class, which moved the hero copy after first
     paint (10px at 1440, 70px at 360 where the button takes its own row).
     It is in flow from the first frame now; only a browser without scripting,
     where the native controls stay and the button would be a dead end, hides
     it. Inline styles are allowed by the CSP; inline scripts are not, which
     is why this is not a no-js class swap in the head. -->
<noscript><style>.hero-reel__launch{display:none}</style></noscript>
