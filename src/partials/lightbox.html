<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer" aria-describedby="lightbox-caption" hidden>
  <button class="lightbox__close" type="button" aria-label="Close" tabindex="-1">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous image" tabindex="-1">&lsaquo;</button>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image" tabindex="-1">&rsaquo;</button>
  <!-- The caption used to be positioned over the viewport, so it centred on the
       screen rather than on the image and read as a stray tooltip. Image,
       caption and counter are one figure now and share the image's box. -->
  <figure class="lightbox__figure">
    <img data-lightbox-image src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" aria-hidden="true" decoding="async" loading="lazy">
    <figcaption class="lightbox__caption" id="lightbox-caption" aria-live="polite"></figcaption>
    <span class="lightbox__count" aria-live="polite"></span>
  </figure>
  <p class="lightbox__hint">esc to close &middot; &larr; &rarr; to browse</p>
</div>
