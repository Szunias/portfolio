<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
  <button class="lightbox__close" aria-label="Close">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous image">&lsaquo;</button>
  <button class="lightbox__nav lightbox__nav--next" aria-label="Next image">&rsaquo;</button>
  <img alt="Portfolio image" decoding="async">
  <span class="lightbox__caption"></span>
</div>
