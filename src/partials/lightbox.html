<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer" aria-describedby="lightbox-caption" hidden>
  <button class="lightbox__close" aria-label="Close" tabindex="-1">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous image" tabindex="-1">&lsaquo;</button>
  <button class="lightbox__nav lightbox__nav--next" aria-label="Next image" tabindex="-1">&rsaquo;</button>
  <img alt="Portfolio image" decoding="async" loading="lazy">
  <span class="lightbox__caption" id="lightbox-caption" aria-live="polite"></span>
</div>
