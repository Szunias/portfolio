<div class="player-bar" id="playerBar">
  <div class="player-bar__left">
    <div class="player-bar__cover" id="playerCover" style="background: linear-gradient(135deg, #3a3a4a, #5a5a6a);"></div>
    <div class="player-bar__info">
      <div class="player-bar__title" id="playerTitle">Select a track</div>
      <div class="player-bar__artist" id="playerArtist">Igor Szuniewicz</div>
    </div>
  </div>
  <div class="player-bar__center">
    <div class="player-bar__controls">
      <!-- Prev -->
      <button class="player-bar__ctrl-btn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg>
      </button>
      <!-- Play/Pause -->
      <button class="player-bar__play-pause" id="playPauseBtn" title="Play">
        <svg viewBox="0 0 24 24" id="playPauseIcon"><polygon points="6,3 20,12 6,21"/></svg>
      </button>
      <!-- Next -->
      <button class="player-bar__ctrl-btn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
      </button>
    </div>
    <div class="player-bar__progress-row">
      <span class="player-bar__time" id="currentTime">0:00</span>
      <div class="player-bar__progress" id="progressBar">
        <div class="player-bar__progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <span class="player-bar__time" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="player-bar__right">
    <div class="player-bar__vol-icon">
      <svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19 11,5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="player-bar__volume" id="volumeBar">
      <div class="player-bar__volume-fill" id="volumeFill" style="width: 70%;"></div>
    </div>
    <!-- Mobile: show a play/pause button since center is hidden -->
    <button class="player-bar__play-pause" id="mobilePlayBtn" title="Play" style="display: none;">
      <svg viewBox="0 0 24 24" id="mobilePlayIcon"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
  </div>
</div>
