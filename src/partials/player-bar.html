<div class="player-bar" id="playerBar">
  <div class="player-bar__left">
    <div class="player-bar__cover" id="playerCover"></div>
    <div class="player-bar__info" aria-live="polite" aria-atomic="true">
      <div class="player-bar__title" id="playerTitle">Select a track</div>
      <div class="player-bar__artist" id="playerArtist">Igor Szuniewicz</div>
      <div class="player-bar__status" id="playerStatus">Normalized playback</div>
    </div>
  </div>
  <div class="player-bar__center">
    <div class="player-bar__controls">
      <button class="player-bar__ctrl-btn player-bar__mode-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle off" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5h-2V6.41l-4.29 4.3-1.42-1.42L17.59 5H16V3zM4 7h3.5c1.33 0 2.59.53 3.54 1.46l.67.67-1.42 1.42-.67-.67A3 3 0 0 0 7.5 9H4V7zm0 8h3.5a3 3 0 0 0 2.12-.88l7.97-7.97L16 4.56V3h5v5h-2V6.41l-7.97 7.97A5 5 0 0 1 7.5 17H4v-2zm10.71-1.71L19 17.59V16h2v5h-5v-2h1.59l-4.3-4.29 1.42-1.42z"/></svg>
      </button>
      <!-- Prev -->
      <button class="player-bar__ctrl-btn" id="prevBtn" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg>
      </button>
      <!-- Play/Pause -->
      <button class="player-bar__play-pause" id="playPauseBtn" title="Play" aria-label="Play or pause track">
        <svg viewBox="0 0 24 24" id="playPauseIcon" aria-hidden="true"><polygon points="6,3 20,12 6,21"/></svg>
      </button>
      <!-- Next -->
      <button class="player-bar__ctrl-btn" id="nextBtn" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
      </button>
      <button class="player-bar__ctrl-btn player-bar__mode-btn" id="repeatBtn" title="Repeat one" aria-label="Repeat one off" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h9.59l-2.3-2.29 1.42-1.42L20.41 8l-4.7 4.71-1.42-1.42L16.59 9H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5zm10 10H7.41l2.3 2.29-1.42 1.42L3.59 16l4.7-4.71 1.42 1.42L7.41 15H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5z"/></svg>
      </button>
    </div>
    <div class="player-bar__progress-row">
      <span class="player-bar__time" id="currentTime">0:00</span>
      <div class="player-bar__progress" id="progressBar">
        <div class="player-bar__progress-buffer" id="progressBuffer"></div>
        <div class="player-bar__progress-fill" id="progressFill"></div>
      </div>
      <span class="player-bar__time" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="player-bar__right">
    <button class="player-bar__vol-icon" id="muteBtn" title="Mute" aria-label="Mute" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19 11,5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="player-bar__volume" id="volumeBar">
      <div class="player-bar__volume-fill" id="volumeFill"></div>
    </div>
    <!-- Fallback play/pause button for compact player variants. -->
    <button class="player-bar__play-pause player-bar__mobile-play" id="mobilePlayBtn" title="Play" aria-label="Play or pause track">
      <svg viewBox="0 0 24 24" id="mobilePlayIcon" aria-hidden="true"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
  </div>
</div>
