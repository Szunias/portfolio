<!-- One shared audio element: music-player controls it, music-visualizer observes it. -->
<audio data-music-audio preload="none"></audio>
<section class="player-bar" id="playerBar" data-player="bar" aria-label="Audio player" hidden>
  <div class="player-bar__progress" data-player="progress" role="slider" aria-label="Seek" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 of 0:00" aria-disabled="true" tabindex="0">
    <div class="player-bar__progress-buffer" data-player="progress-buffer" aria-hidden="true"></div>
    <div class="player-bar__progress-fill" data-player="progress-fill" aria-hidden="true"></div>
  </div>

  <button class="player-bar__now" type="button" data-player="open-sheet" aria-haspopup="dialog" aria-label="Open now playing">
    <img class="player-bar__cover" data-player="cover" src="assets/track-placeholder.svg" alt="" aria-hidden="true" width="52" height="52" decoding="async">
    <span class="player-bar__info">
      <span class="player-bar__title" data-player="title">Select a track</span>
      <span class="player-bar__line">
        <span class="player-bar__artist" data-player="artist">Igor Szuniewicz</span>
        <span class="player-bar__sep" aria-hidden="true">&middot;</span>
        <span class="player-bar__status" data-player="status" role="status" aria-atomic="true">Ready to play</span>
      </span>
    </span>
    <span class="player-bar__expand" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>

  <div class="player-bar__controls">
    <button class="player-ctrl player-ctrl--mode player-bar__only-wide" type="button" data-player="shuffle" title="Shuffle" aria-label="Shuffle off" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5h-2V6.41l-4.29 4.3-1.42-1.42L17.59 5H16V3zM4 7h3.5c1.33 0 2.59.53 3.54 1.46l.67.67-1.42 1.42-.67-.67A3 3 0 0 0 7.5 9H4V7zm0 8h3.5a3 3 0 0 0 2.12-.88l7.97-7.97L16 4.56V3h5v5h-2V6.41l-7.97 7.97A5 5 0 0 1 7.5 17H4v-2zm10.71-1.71L19 17.59V16h2v5h-5v-2h1.59l-4.3-4.29 1.42-1.42z"/></svg>
    </button>
    <button class="player-ctrl player-bar__only-wide" type="button" data-player="prev" title="Previous" aria-label="Previous track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg>
    </button>
    <button class="player-ctrl player-ctrl--play" type="button" data-player="play" title="Play" aria-label="Play first track">
      <svg viewBox="0 0 24 24" data-player="play-icon" aria-hidden="true"><polygon points="6,3 20,12 6,21"/></svg>
    </button>
    <button class="player-ctrl" type="button" data-player="next" title="Next" aria-label="Next track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
    </button>
    <button class="player-ctrl player-ctrl--mode player-bar__only-wide" type="button" data-player="repeat" title="Repeat" aria-label="Repeat mode: off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h9.59l-2.3-2.29 1.42-1.42L20.41 8l-4.7 4.71-1.42-1.42L16.59 9H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5zm10 10H7.41l2.3 2.29-1.42 1.42L3.59 16l4.7-4.71 1.42 1.42L7.41 15H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5z"/></svg>
      <span class="player-ctrl__badge" aria-hidden="true">1</span>
    </button>
  </div>

  <div class="player-bar__meters">
    <span class="player-bar__time-group">
      <span class="player-bar__time" data-player="current-time">0:00</span>
      <span class="player-bar__time-sep" aria-hidden="true">/</span>
      <span class="player-bar__time" data-player="total-time">0:00</span>
    </span>
    <!-- A div, not a span: the volume slider inside is block content and a
         span wrapper made the document invalid. -->
    <div class="player-bar__volume-group">
      <button class="player-ctrl player-ctrl--small" type="button" data-player="mute" title="Mute" aria-label="Mute audio" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19 11,5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="player-bar__volume" data-player="volume" role="slider" aria-label="Volume" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-valuetext="70%" tabindex="0">
        <div class="player-bar__volume-fill" data-player="volume-fill"></div>
      </div>
    </div>
  </div>
</section>

<dialog class="now-playing" id="nowPlaying" data-player="sheet" aria-label="Now playing">
  <div class="now-playing__inner">
    <header class="now-playing__head">
      <p class="now-playing__eyebrow">Now playing</p>
      <button class="now-playing__close" type="button" data-player="close-sheet" aria-label="Close now playing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <img class="now-playing__art" data-player="cover" src="assets/track-placeholder.svg" alt="" aria-hidden="true" width="640" height="640" decoding="async">

    <div class="now-playing__meta">
      <h2 class="now-playing__title" data-player="title">Select a track</h2>
      <p class="now-playing__artist" data-player="artist">Igor Szuniewicz</p>
      <p class="now-playing__detail" data-player="detail"></p>
    </div>

    <div class="now-playing__seek">
      <div class="now-playing__scrub" data-player="progress" role="slider" aria-label="Seek" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 of 0:00" aria-disabled="true" tabindex="0">
        <div class="player-bar__progress-buffer" data-player="progress-buffer" aria-hidden="true"></div>
        <div class="player-bar__progress-fill" data-player="progress-fill" aria-hidden="true"></div>
      </div>
      <p class="now-playing__times">
        <span data-player="current-time">0:00</span>
        <span data-player="total-time">0:00</span>
      </p>
    </div>

    <div class="now-playing__controls">
      <button class="player-ctrl player-ctrl--mode" type="button" data-player="shuffle" title="Shuffle" aria-label="Shuffle off" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5h-2V6.41l-4.29 4.3-1.42-1.42L17.59 5H16V3zM4 7h3.5c1.33 0 2.59.53 3.54 1.46l.67.67-1.42 1.42-.67-.67A3 3 0 0 0 7.5 9H4V7zm0 8h3.5a3 3 0 0 0 2.12-.88l7.97-7.97L16 4.56V3h5v5h-2V6.41l-7.97 7.97A5 5 0 0 1 7.5 17H4v-2zm10.71-1.71L19 17.59V16h2v5h-5v-2h1.59l-4.3-4.29 1.42-1.42z"/></svg>
      </button>
      <button class="player-ctrl" type="button" data-player="prev" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg>
      </button>
      <button class="player-ctrl player-ctrl--play player-ctrl--large" type="button" data-player="play" title="Play" aria-label="Play first track">
        <svg viewBox="0 0 24 24" data-player="play-icon" aria-hidden="true"><polygon points="6,3 20,12 6,21"/></svg>
      </button>
      <button class="player-ctrl" type="button" data-player="next" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
      </button>
      <button class="player-ctrl player-ctrl--mode" type="button" data-player="repeat" title="Repeat" aria-label="Repeat mode: off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h9.59l-2.3-2.29 1.42-1.42L20.41 8l-4.7 4.71-1.42-1.42L16.59 9H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5zm10 10H7.41l2.3 2.29-1.42 1.42L3.59 16l4.7-4.71 1.42 1.42L7.41 15H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5z"/></svg>
        <span class="player-ctrl__badge" aria-hidden="true">1</span>
      </button>
    </div>

    <section class="now-playing__queue" aria-labelledby="np-queue-title">
      <h3 class="now-playing__queue-title" id="np-queue-title">Playing next</h3>
      <ol class="now-playing__queue-list" data-player="queue"></ol>
    </section>
  </div>
</dialog>
