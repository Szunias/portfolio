<!-- One footer, four stylesheets: the agreed treatment is the case-page one
     (mono, uppercase, 11px, underlined links). The two spans carry explicit
     class hooks so every stylesheet targets the same thing instead of
     `.colophon > span:last-child`, and so neither needs a page-specific class. -->
<footer class="colophon">
  <!-- The separator travels with the clock: contact.css hides the pair, so no
       middot is left dangling at the end of the line there. -->
  <span class="colophon__meta">Igor Szuniewicz &copy; {{YEAR}} &middot; BE / PL / AT <span class="colophon__graz">&middot; <a class="colophon__clock" href="{{ROOT}}contact.html">Graz&nbsp;<time data-colophon-time datetime="">&mdash;</time></a></span></span>
  <!-- Each separator lives inside a no-wrap pair with its link, so a narrow
       screen breaks between pairs and never strands a middot at a line end. -->
  <span class="colophon__links"><a href="mailto:igorszuniewiczwork@gmail.com">Email</a> <span class="colophon__pair">&middot; <a href="https://www.linkedin.com/in/igorszuniewicz">LinkedIn</a></span> <span class="colophon__pair">&middot; <a href="https://github.com/Szunias">GitHub</a></span> <span class="colophon__pair">&middot; <a href="{{ROOT}}Igor_Szuniewicz_CV.pdf">CV</a></span> <span class="colophon__pair">&middot; <a href="https://igorszuniewicz.itch.io">itch.io</a></span> <span class="colophon__pair">&middot; <a href="https://open.spotify.com/artist/6jEBXZZOeunaMzMnnHYvd6">Spotify</a></span></span>
</footer>
