<section class="ck ck--contact" data-time-root data-phase="night" aria-labelledby="contact-title">
  <div class="ck__room">
    <div class="ck__side">
      <h1 class="ck__title" id="contact-title">Contact</h1>
      <p class="ck__intro">Write to me about freelance sound design, audio implementation or studio roles.</p>
      <p class="ck__intro ck__move">I&rsquo;m open to relocating.</p>
      <p class="ck__mail">
        <a data-mail-link href="mailto:igorszuniewiczwork@gmail.com">igorszuniewiczwork@<wbr>gmail.com</a>
      </p>
      <div class="ck__actions">
        <a class="btn btn--primary" data-mail-link href="mailto:igorszuniewiczwork@gmail.com">Send email <span aria-hidden="true">↗</span></a>
        <button class="btn btn--ghost ck__copy" type="button" data-copy-mail data-copy-state="idle" hidden><span class="ck__copy-idle">Copy email</span><span class="ck__copy-done">Copied</span></button>
      </div>
      <p class="ck__write">Send your project, scope and timeline. <span class="ck__lang">English or Polish.</span></p>
      <p class="ck__status" data-copy-status role="status" aria-live="polite"></p>
      <nav class="ck__out" aria-label="CV and profiles">
        <a class="ck__cv" href="Igor_Szuniewicz_CV.pdf" download>Download CV <span aria-hidden="true">↓</span></a>
        <a href="https://www.linkedin.com/in/igorszuniewicz" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/Szunias" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://igorszuniewicz.itch.io" target="_blank" rel="noopener noreferrer">itch.io</a>
        <a href="https://open.spotify.com/artist/6jEBXZZOeunaMzMnnHYvd6" target="_blank" rel="noopener noreferrer">Spotify</a>
      </nav>
    </div>
    <figure class="ck__plate">
      <svg class="ck__dial" viewBox="0 0 100 100" role="slider" tabindex="0"
           aria-label="Wind the clock to preview another hour in Graz"
           aria-valuemin="-24" aria-valuemax="24" aria-valuenow="0" aria-valuetext="now">
        <defs>
          <radialGradient id="ck-sky" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="48">
            <stop offset="0" stop-color="#aac6de" stop-opacity="0" data-sky="core"></stop>
            <stop offset="1" stop-color="#aac6de" stop-opacity="0" data-sky="edge"></stop>
          </radialGradient>
          <clipPath id="ck-crown-clip"><rect x="46.4" y="-3" width="7.2" height="3.6" rx="0.9"></rect></clipPath>
        </defs>
        <g class="ck__crown" aria-hidden="true">
          <rect class="ck__stem" x="48.9" y="0.3" width="2.2" height="1.6"></rect>
          <rect class="ck__crown-body" x="46.4" y="-3" width="7.2" height="3.6" rx="0.9"></rect>
          <g clip-path="url(#ck-crown-clip)">
            <g class="ck__knurl" data-knurl>
              <line x1="44.8" y1="-3" x2="44.8" y2="0.6"></line>
              <line x1="46.4" y1="-3" x2="46.4" y2="0.6"></line>
              <line x1="48" y1="-3" x2="48" y2="0.6"></line>
              <line x1="49.6" y1="-3" x2="49.6" y2="0.6"></line>
              <line x1="51.2" y1="-3" x2="51.2" y2="0.6"></line>
              <line x1="52.8" y1="-3" x2="52.8" y2="0.6"></line>
              <line x1="54.4" y1="-3" x2="54.4" y2="0.6"></line>
            </g>
          </g>
        </g>
        <circle class="ck__ring" cx="50" cy="50" r="48"></circle>
        <circle class="ck__sky" cx="50" cy="50" r="47.4" fill="url(#ck-sky)"></circle>
        <g data-ticks></g>
        <line class="ck__hand ck__hand--hour" data-hand="hour" x1="50" y1="50" x2="50" y2="30"></line>
        <line class="ck__hand ck__hand--minute" data-hand="minute" x1="50" y1="50" x2="50" y2="20"></line>
        <line class="ck__hand ck__hand--second" data-hand="second" x1="50" y1="54" x2="50" y2="16"></line>
        <circle class="ck__cap" cx="50" cy="50" r="1.8"></circle>
      </svg>
      <figcaption class="ck__cap-line">
        <time class="ck__cap-time" data-cap-time datetime=""><span data-cap-hm>&mdash;</span> <span class="ck__cap-zone" data-cap-zone></span></time>
        <span class="ck__cap-where" data-cap-where>Graz, Austria</span>
        <span class="ck__cap-you" data-cap-you hidden></span>
      </figcaption>
    </figure>

  </div>
</section>
