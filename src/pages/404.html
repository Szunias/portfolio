<!-- A 404 exists to recover a lost visitor, so it names the real destinations
     rather than pointing at the home page and leaving half a screen empty. -->
<section class="error-page" aria-labelledby="error-title">
  <p class="error-page__code" aria-hidden="true">404</p>
  <h1 id="error-title">Page not found</h1>
  <!-- A signal that has just stopped: a few dying cycles, then flat. -->
  <svg class="error-page__air" viewBox="0 0 320 24" aria-hidden="true" focusable="false">
    <path d="M0 12 L8 3 16 12 24 19 32 12 40 7.5 48 12 56 15.5 64 12 72 10 80 12 88 13.2 96 12 H320" fill="none"></path>
  </svg>
  <p>The address may be outdated or mistyped. These are the three sections of the site.</p>

  <nav class="error-routes" aria-label="Main sections">
    <a href="/#work">
      <span class="error-routes__name">Selected work</span>
      <span class="error-routes__desc">Six featured projects, three tools and eight earlier ones.</span>
    </a>
    <a href="/music.html">
      <span class="error-routes__name">Music</span>
      <span class="error-routes__desc">Scores and arrangements, then a dated archive of every track.</span>
    </a>
    <a href="/contact.html">
      <span class="error-routes__name">Contact</span>
      <span class="error-routes__desc">Email, profiles and the CV.</span>
    </a>
  </nav>
</section>
