        * {
            margin: 0;
            padding: 0;

        }

            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e0e6ed;
            line-height: 1.6;
            overflow-x: hidden;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background gradient matching main site */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 22%, rgba(59, 130, 246, 0.09) 0%, rgba(59, 130, 246, 0.02) 42%, transparent 70%), radial-gradient(circle at 80% 78%, rgba(139, 92, 246, 0.065) 0%, rgba(139, 92, 246, 0.015) 45%, transparent 72%), radial-gradient(circle at 52% 50%, rgba(236, 72, 153, 0.03) 0%, rgba(236, 72, 153, 0.007) 55%, transparent 80%), linear-gradient(170deg, #010309 0%, #040913 52%, #08101c 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        /* 404 Content */
        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8rem 2rem 4rem;
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-family: "Sora", sans-serif;
            font-size: clamp(8rem, 20vw, 16rem);
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {

            0%,
            100% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(2px, -2px);
            }

            60% {
                transform: translate(-2px, -2px);
            }

            80% {
                transform: translate(2px, 2px);
            }
        }

        .error-title {
            font-family: "Sora", sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .error-description {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 3rem;
            max-width: 600px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            letter-spacing: 0.02em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e6ed;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Floating icons animation */
        .floating-icons {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.1;
        }

        .floating-icon {
            position: absolute;
            font-size: 3rem;
            color: #60a5fa;
            animation: float 15s ease-in-out infinite;
        }

        .floating-icon:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            left: 80%;
            top: 30%;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(3) {
            left: 15%;
            top: 70%;
            animation-delay: 4s;
        }

        .floating-icon:nth-child(4) {
            left: 70%;
            top: 80%;
            animation-delay: 6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(5deg);
            }

            50% {
                transform: translateY(0) rotate(0deg);
            }

            75% {
                transform: translateY(-20px) rotate(-5deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-content {
                padding: 6rem 1.5rem 3rem;
            }

            .error-code {
                font-size: clamp(6rem, 15vw, 10rem);
                margin-bottom: 0.5rem;
            }

            .error-title {
                font-size: clamp(1.5rem, 4vw, 2rem);
            }

            .error-description {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .error-actions {
                flex-direction: column;
                gap: 0.75rem;
                width: 100%;
                max-width: 300px;
            }

            .btn {
                width: 100%;
                padding: 0.8rem 1.5rem;
            }
        }
    </style>
</head>
