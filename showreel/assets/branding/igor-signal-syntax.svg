<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 160 160"
  fill="none"
  role="img"
  aria-labelledby="signal-syntax-title signal-syntax-description"
>
  <title id="signal-syntax-title">Igor Szuniewicz — Signal Syntax</title>
  <desc id="signal-syntax-description">
    Two code-like gates joined by a routed signal that forms an abstract S.
  </desc>

  <!--
    SIGNAL SYNTAX
    The gates stand for code and implementation. The continuous routed signal
    between them forms an abstract S. The square terminals keep the mark crisp
    at favicon size and provide clean points for sectional animation.
  -->
  <g
    stroke="#ECEEF0"
    stroke-width="10"
    stroke-linecap="square"
    stroke-linejoin="miter"
    shape-rendering="geometricPrecision"
  >
    <path id="gate-in" pathLength="1" d="M54 20H26V140H54"/>
    <path
      id="signal"
      pathLength="1"
      d="M110 48H62C50 48 42 56 42 67C42 78 50 86 62 86H98C110 86 118 94 118 105C118 116 110 124 98 124H50"
    />
    <path id="gate-out" pathLength="1" d="M106 20H134V140H106"/>
  </g>
</svg>
