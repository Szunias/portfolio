<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Igor Szuniewicz — cinematic wordmark</title>
  <desc id="desc">Editable typographic identity for the 2026 technical sound design showreel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset=".55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#10141a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#aac6de" stop-opacity="0"/>
      <stop offset=".18" stop-color="#aac6de" stop-opacity=".7"/>
      <stop offset=".82" stop-color="#aac6de" stop-opacity=".7"/>
      <stop offset="1" stop-color="#aac6de" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Remove this rectangle when a transparent wordmark export is needed. -->
  <rect width="1920" height="1080" fill="url(#background)"/>

  <!-- Vertical samples are part of the motion language, not a separate logo. -->
  <g id="signal-samples" stroke="#aac6de" stroke-linecap="square" opacity=".11">
    <path d="M310 510v20M338 488v64M366 474v92M394 503v34M422 456v128M450 483v74M478 441v158M506 497v46M534 469v102M562 430v180M590 478v84M618 451v138M646 494v52M674 463v114M702 438v164M730 486v68M758 457v126M786 420v200M814 476v88M842 449v142M870 491v58M898 461v118M926 432v176M954 482v78M982 452v136M1010 414v212M1038 474v92M1066 445v150M1094 490v60M1122 458v124M1150 426v188M1178 480v80M1206 449v142M1234 417v206M1262 475v90M1290 453v134M1318 488v64M1346 462v116M1374 433v174M1402 482v76M1430 455v130M1458 473v94M1486 494v52M1514 480v80M1542 505v30M1570 490v60"/>
  </g>

  <g id="wordmark" text-anchor="middle">
    <text x="960" y="405"
          fill="#aac6de"
          font-family="'IBM Plex Mono', monospace"
          font-size="26"
          letter-spacing="8">IGOR</text>
    <text x="960" y="555"
          fill="#eceef0"
          font-family="'Inter Tight', 'Arial Narrow', sans-serif"
          font-size="156"
          font-weight="700"
          letter-spacing="-2">SZUNIEWICZ</text>
    <rect x="530" y="590" width="860" height="2" fill="url(#rule)" filter="url(#soft-glow)"/>
    <text x="960" y="650"
          fill="#eceef0"
          font-family="'IBM Plex Mono', monospace"
          font-size="19"
          letter-spacing="3">TECHNICAL SOUND DESIGN · AUDIO PROGRAMMING</text>
    <text x="960" y="695"
          fill="#9aa0a8"
          font-family="'IBM Plex Mono', monospace"
          font-size="14"
          letter-spacing="2.5">SHOWREEL / 2026</text>
  </g>
</svg>
