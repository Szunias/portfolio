<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreal Engine Rebuilder — Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;1,9..144,300;1,9..144,400&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 780px;
    height: 495px;
    background: #1b1a18;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 44px 48px 36px;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    pointer-events: none;
  }

  /* Accent glow - Unreal purple-ish */
  .card::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: -40px;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(120, 120, 180, 0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .top {
    position: relative;
    z-index: 1;
  }

  .label {
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    font-size: 9px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(237, 233, 225, 0.3);
  }

  .rule {
    display: block;
    width: 36px;
    height: 1.5px;
    background: #7878b4;
    margin-top: 14px;
  }

  .title {
    position: relative;
    z-index: 1;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-optical-sizing: auto;
    font-size: 46px;
    line-height: 1.14;
    letter-spacing: -0.02em;
    color: #ede9e1;
    max-width: 640px;
  }

  .title em {
    font-style: italic;
    font-weight: 300;
  }

  .subtitle {
    position: relative;
    z-index: 1;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: 20px;
    line-height: 1.5;
    color: rgba(237, 233, 225, 0.35);
    max-width: 480px;
    margin-top: -20px;
  }

  .meta {
    position: relative;
    z-index: 1;
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(237, 233, 225, 0.22);
    text-transform: uppercase;
  }

  .hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #555;
    font-family: 'Outfit', sans-serif;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="label">Dev Tool &middot; Automation</span>
      <span class="rule"></span>
    </div>

    <h1 class="title">Linker Errors <em>at 11pm?</em> One Click. <em>Clean Rebuild</em> from Scratch.</h1>

    <p class="subtitle">Cleans Intermediate, regenerates project files, recompiles. Seconds instead of minutes.</p>

    <span class="meta">Igor Szuniewicz &ensp;&middot;&ensp; Unreal Engine Rebuilder &ensp;&middot;&ensp; 2024</span>
  </div>

  <p class="hint">780 x 495 — screenshot the card above with Win+Shift+S</p>
</body>
</html>
