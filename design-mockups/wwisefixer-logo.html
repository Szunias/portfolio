<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wwise Fixer — Logo</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 780px;
    height: 440px;
    background: #0d0d0d;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 48px;
  }

  /* Big W mark */
  .mark {
    width: 140px;
    height: 140px;
    border-radius: 28px;
    background: #f68a36;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .mark-letter {
    font-family: Georgia, serif;
    font-size: 88px;
    font-weight: 700;
    color: #0d0d0d;
    line-height: 1;
    margin-top: 4px;
  }

  /* Small fix icon overlay */
  .mark-badge {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 40px;
    height: 40px;
    background: #0d0d0d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark-badge-inner {
    width: 28px;
    height: 28px;
    background: #22c55e;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark-badge-inner svg {
    width: 16px;
    height: 16px;
  }

  .text-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .title {
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 800;
    font-size: 48px;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .sub {
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.02em;
  }

  .hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #333;
    font-family: sans-serif;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="mark">
        <span class="mark-letter">W</span>
        <div class="mark-badge">
          <div class="mark-badge-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="text-side">
        <h1 class="title">Wwise Fixer</h1>
        <p class="sub">Unreal Engine Integration Repair Tool</p>
      </div>
    </div>
  </div>
  <p class="hint">780 x 440 — screenshot with Win+Shift+S</p>
</body>
</html>
