<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreal Rebuilder — Logo</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 780px;
    height: 440px;
    background: #0d0d0d;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .mark {
    width: 140px;
    height: 140px;
    border-radius: 28px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Two circular arrows using CSS */
  .rebuild-icon {
    width: 72px;
    height: 72px;
    position: relative;
  }

  .rebuild-icon .arrow {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 5px solid transparent;
    border-radius: 50%;
  }

  .rebuild-icon .arrow-top {
    top: 0;
    left: 6px;
    border-top-color: #0d0d0d;
    border-right-color: #0d0d0d;
  }

  .rebuild-icon .arrow-top::after {
    content: '';
    position: absolute;
    top: -3px;
    right: -12px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #0d0d0d;
    transform: rotate(-45deg);
  }

  .rebuild-icon .arrow-bottom {
    bottom: 0;
    right: 6px;
    border-bottom-color: #0d0d0d;
    border-left-color: #0d0d0d;
  }

  .rebuild-icon .arrow-bottom::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: -12px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 12px solid #0d0d0d;
    transform: rotate(-45deg);
  }

  .text-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .title {
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 800;
    font-size: 48px;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .title span {
    display: block;
  }

  .sub {
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.02em;
  }

  .hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #333;
    font-family: sans-serif;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="mark">
        <div class="rebuild-icon">
          <div class="arrow arrow-top"></div>
          <div class="arrow arrow-bottom"></div>
        </div>
      </div>

      <div class="text-side">
        <h1 class="title">
          <span>Unreal</span>
          <span>Rebuilder</span>
        </h1>
        <p class="sub">One-Click Clean Build Automation</p>
      </div>
    </div>
  </div>
  <p class="hint">780 x 440 — screenshot with Win+Shift+S</p>
</body>
</html>
