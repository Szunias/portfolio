<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mobile Menu</title>
    <link rel="stylesheet" href="assets/css/global/navigation.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .test-info {
            margin-top: 100px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        #debug-log {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0,255,0,0.1);
            border: 1px solid #0f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <header class="header" id="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">Test Site</a>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                </ul>
                <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay"></div>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <ul class="mobile-nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </div>

    <!-- Test Info -->
    <div class="container">
        <div class="test-info">
            <h1>Mobile Menu Test</h1>
            <p>Resize your browser to mobile width (max 640px) to see the hamburger menu.</p>
            <p>Current viewport width: <strong id="viewport-width"></strong></p>
            <p>Toggle button visible: <strong id="toggle-visible"></strong></p>
            <div id="debug-log"></div>
        </div>
    </div>

    <script>
        const debugLog = document.getElementById('debug-log');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `[${time}] ${message}<br>`;
            console.log(message);
        }

        // Update viewport info
        function updateViewportInfo() {
            document.getElementById('viewport-width').textContent = window.innerWidth + 'px';
            const toggle = document.querySelector('.mobile-menu-toggle');
            const isVisible = toggle && window.getComputedStyle(toggle).display !== 'none';
            document.getElementById('toggle-visible').textContent = isVisible ? 'YES' : 'NO';
        }

        updateViewportInfo();
        window.addEventListener('resize', updateViewportInfo);

        // Initialize mobile menu with detailed logging
        function initMobileMenu() {
            log('initMobileMenu() called');

            // Prevent double initialization
            if (window.__mobileMenuInitialized) {
                log('Already initialized, skipping');
                return;
            }
            window.__mobileMenuInitialized = true;

            const setup = () => {
                log('setup() called');

                const toggle = document.querySelector(".mobile-menu-toggle");
                const menu = document.querySelector(".mobile-menu");
                const overlay = document.querySelector(".mobile-menu-overlay");

                log(`Elements found - toggle: ${!!toggle}, menu: ${!!menu}, overlay: ${!!overlay}`);

                const closeMenu = () => {
                    log('closeMenu() called');
                    toggle?.classList.remove("active");
                    menu?.classList.remove("active");
                    overlay?.classList.remove("active");
                };

                const openMenu = () => {
                    log('openMenu() called');
                    toggle?.classList.add("active");
                    menu?.classList.add("active");
                    overlay?.classList.add("active");
                };

                document.addEventListener("click", (event) => {
                    const target = event.target;
                    log(`Click detected on: ${target.tagName} ${target.className}`);

                    if (toggle && toggle.contains(target)) {
                        log('Click is on toggle button');
                        if (menu?.classList.contains("active")) {
                            log('Menu is active, closing');
                            closeMenu();
                        } else {
                            log('Menu is not active, opening');
                            openMenu();
                        }
                        return;
                    }

                    if (
                        target === overlay ||
                        target?.closest(".mobile-menu a, .mobile-lang-switcher .lang-btn")
                    ) {
                        log('Click on overlay or menu link, closing');
                        closeMenu();
                    }
                });

                document.addEventListener("keydown", (event) => {
                    if (event.key === "Escape" && menu?.classList.contains("active")) {
                        log('Escape pressed, closing menu');
                        closeMenu();
                    }
                });

                log('Event listeners attached');
            };

            if (document.readyState === "loading") {
                log('Document still loading, waiting for DOMContentLoaded');
                document.addEventListener("DOMContentLoaded", setup, { once: true });
            } else {
                log('Document ready, running setup immediately');
                setup();
            }
        }

        // Initialize
        initMobileMenu();
    </script>
</body>
</html>
