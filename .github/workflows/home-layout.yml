name: Homepage layout checks

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/css/**'
      - 'src/js/**'
      - 'src/layouts/**'
      - 'src/partials/**'
      - 'site.config.cjs'
      - 'scripts/check-home-layout.cjs'
      - 'scripts/check-site-interactions.cjs'
      - '.github/workflows/home-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the actual site
        run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/home-layout" --no-audit --no-fund --package-lock=false playwright@1.63.0
          node "$RUNNER_TEMP/home-layout/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check responsive layouts and interactions
        env:
          # The hero is deliberately fixed only for this refresh, not for later redesigns.
          REFRESH_BASE: ${{ github.head_ref == 'feat/portfolio-section-refresh-20260908' && github.event.pull_request.base.sha || '' }}
        run: NODE_PATH="$RUNNER_TEMP/home-layout/node_modules" node scripts/check-home-layout.cjs
      - name: Check all registered routes and motion preferences
        run: NODE_PATH="$RUNNER_TEMP/home-layout/node_modules" node scripts/check-site-interactions.cjs
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: homepage-layout-results
          path: layout-results/
          retention-days: 7
          if-no-files-found: warn
