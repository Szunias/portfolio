name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build pages
        run: node build.cjs

      - name: Copy assets to dist
        run: |
          # Legacy assets referenced by HTML via relative paths
          cp -r old dist/old
          # Root-level assets referenced directly
          for f in audioqscreenshot.png transienticascreenshot.webm transienticascreenshot.png transienticascreenshtogif.gif UnrealEngineDemo.mp4 PythonPrototypeDemo.mp4 szuniewicz-ai-audio-thesis-2026.pdf shadowframes.png shadowframes-page.png shadowframes-page-16s.png aithesiscover.png audioqscreenshot.png rayaloneinthecave.png sounddesignreel.png xrlabssoldiers.png "belgian military university.png" Igor_Szuniewicz_CV.pdf; do
            if [ -f "$f" ]; then
              cp "$f" dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
