<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Project Fix</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #4a9eff; }
    </style>
</head>
<body>
    <h1>Project Navigation Fix Verification</h1>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${time}] ${msg}\n`;
            output.appendChild(span);
        }

        // Test the shouldInterceptLink logic
        function testProjectDetection() {
            log('=== Testing Project Page Detection ===', 'info');

            // Test cases
            const testCases = [
                { href: 'shadow-frames.html', currentPath: '/projects', expected: false },
                { href: 'richter.html', currentPath: '/projects', expected: false },
                { href: '/projects/amorak.html', currentPath: '/', expected: false },
                { href: 'index.html', currentPath: '/projects', expected: true },
                { href: '/music.html', currentPath: '/', expected: true },
                { href: '/projects', currentPath: '/', expected: true }
            ];

            testCases.forEach(test => {
                // Simulate the logic from shouldInterceptLink
                let targetPath;
                try {
                    let basePath = test.currentPath;
                    if (!basePath.includes('.') && !basePath.endsWith('/')) {
                        basePath = basePath + '/';
                    }
                    const baseUrl = new URL(basePath, window.location.origin).href;
                    const absoluteUrl = new URL(test.href, baseUrl).href;

                    // Normalize (remove trailing slash, convert index.html)
                    const urlObj = new URL(absoluteUrl);
                    targetPath = urlObj.pathname;
                    if (targetPath.length > 1 && targetPath.endsWith('/')) {
                        targetPath = targetPath.slice(0, -1);
                    }
                    if (targetPath === '/index.html') {
                        targetPath = '/';
                    }
                    if (targetPath.endsWith('/index.html')) {
                        targetPath = targetPath.slice(0, -11);
                    }
                } catch {
                    targetPath = test.href;
                }

                // Check if should use AJAX
                let shouldUseAJAX = true;
                if (targetPath.includes('/projects/') && targetPath.endsWith('.html')) {
                    if (!targetPath.endsWith('/index.html')) {
                        shouldUseAJAX = false;
                    }
                }

                const result = shouldUseAJAX === test.expected;
                const resultText = result ? 'PASS' : 'FAIL';
                const resultType = result ? 'success' : 'error';

                log(`${resultText}: href="${test.href}" from="${test.currentPath}" → ${targetPath}`, resultType);
                log(`  Expected AJAX=${test.expected}, Got AJAX=${shouldUseAJAX}`, resultType);
            });
        }

        // Run tests
        testProjectDetection();

        log('\n=== Summary ===', 'info');
        log('If all tests PASS, project pages will use normal navigation (no AJAX)', 'info');
        log('If any test FAILS, there\'s still an issue with the detection logic', 'info');
    </script>
</body>
</html>
